name: Release DungeonGen

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Verify release versions
        shell: bash
        run: |
          expected_version="${{ steps.meta.outputs.version }}"
          gradle_version="$(grep '^pluginVersion=' gradle.properties | cut -d= -f2-)"
          manifest_version="$(python3 -c 'import json, pathlib; print(json.loads(pathlib.Path("src/main/resources/manifest.json").read_text(encoding="utf-8"))["Version"])')"

          [[ "$gradle_version" == "$expected_version" ]] || {
            echo "gradle.properties pluginVersion '$gradle_version' does not match tag version '$expected_version'" >&2
            exit 1
          }

          [[ "$manifest_version" == "$expected_version" ]] || {
            echo "manifest.json Version '$manifest_version' does not match tag version '$expected_version'" >&2
            exit 1
          }

      - name: Build shadow jar
        run: ./gradlew --no-daemon shadowJar

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DungeonGen-${{ steps.meta.outputs.version }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: DungeonGen v${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: build/libs/*.jar
